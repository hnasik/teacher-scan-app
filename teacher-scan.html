<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teacher Attendance Scan</title>

<!-- QR Scanner -->
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    text-align: center;
    padding: 20px;
  }
  h2 { margin-bottom: 5px; }
  #reader {
    width: 300px;
    margin: 20px auto;
  }
  .msg {
    margin-top: 15px;
    font-size: 16px;
    font-weight: bold;
  }
  .success { color: green; }
  .error { color: red; }
</style>
</head>

<body>

<h2>Scan Attendance QR</h2>
<p>Point your camera at your QR code</p>

<div id="reader"></div>
<div id="message" class="msg"></div>

<script type="module">
/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { 
  getFirestore,
  doc,
  setDoc,
  getDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCOzfdIXBeh6drFhml4pOFEvPG8xV_Wjzw",
  authDomain: "school-management-projec-9db7a.firebaseapp.com",
  projectId: "school-management-projec-9db7a",
  storageBucket: "school-management-projec-9db7a.firebasestorage.app",
  messagingSenderId: "975842483778",
  appId: "1:975842483778:web:d1708792ff56014f3317db"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================= LOAD LOGGED IN TEACHER ================= */
const loggedInTeacher = JSON.parse(localStorage.getItem("teacherLogin"));

if (!loggedInTeacher) {
  alert("Not logged in");
  window.location.href = "teacher-login.html";
}

const msg = document.getElementById("message");

/* ================= SAVE ATTENDANCE ================= */
async function saveAttendance() {
  const today = new Date().toISOString().split("T")[0];

  const attendanceRef = doc(
    db,
    "attendance",
    loggedInTeacher.ownerId,      // schoolId
    today,
    loggedInTeacher.teacherId
  );

  const alreadyMarked = await getDoc(attendanceRef);
  if (alreadyMarked.exists()) {
    msg.textContent = "Attendance already marked today";
    msg.className = "msg error";
    return;
  }

  await setDoc(attendanceRef, {
    teacherId: loggedInTeacher.teacherId,
    teacherName: loggedInTeacher.name,
    schoolId: loggedInTeacher.ownerId,
    date: today,
    status: "Present",
    method: "QR",
    createdAt: serverTimestamp()
  });

  msg.textContent = "Attendance marked successfully";
  msg.className = "msg success";
}

/* ================= QR HANDLER ================= */
async function onScanSuccess(decodedText) {
  try {
    const qrData = JSON.parse(decodedText);

    if (
      qrData.schoolId === loggedInTeacher.ownerId &&
      qrData.purpose === "teacher-attendance"
    ) {
      await saveAttendance();
      html5QrCode.stop();
    } else {
      msg.textContent = "Invalid school QR code";
      msg.className = "msg error";
    }

  } catch {
    msg.textContent = "Invalid QR format";
    msg.className = "msg error";
  }
}

/* ================= START BACK CAMERA ================= */
const html5QrCode = new Html5Qrcode("reader");

html5QrCode.start(
  { facingMode: "environment" },   // back camera
  { fps: 10, qrbox: 250 },
  onScanSuccess
).catch(err => {
  msg.textContent = "Camera access denied or not available";
  msg.className = "msg error";
  console.error(err);
});

</script>

</body>
</html>
