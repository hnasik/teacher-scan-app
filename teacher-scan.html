<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Teacher Attendance Scan</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
  :root {
    --primary-color: #4a90e2;
    --primary-dark: #357abd;
    --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    --card-bg: #ffffff;
    --text-color: #333333;
    --text-light: #777777;
    --error-color: #e74c3c;
    --success-color: #2ecc71;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    --radius: 12px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-gradient);
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    color: var(--text-color);
  }

  /* App Container */
  .app-container {
    background: var(--card-bg);
    width: 100%;
    max-width: 500px; /* Slightly wider for the scanner */
    padding: 25px 20px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    text-align: center;
    display: flex;
    flex-direction: column;
    height: 100%; /* Fill height on mobile */
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-bottom: 1px solid #eee;
    padding-bottom: 15px;
  }

  .header h2 {
    margin: 0;
    font-size: 1.2rem;
    font-weight: 600;
  }

  .logout-btn {
    background: none;
    border: none;
    color: var(--text-light);
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 500;
  }
  .logout-btn:hover { color: var(--error-color); }

  /* Instructions */
  p.instruction {
    color: var(--text-light);
    margin-bottom: 15px;
    font-size: 0.9rem;
  }

  /* QR Reader Styling */
  #reader {
    width: 100%;
    border-radius: var(--radius);
    overflow: hidden;
    background: #000;
    margin: 0 auto;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    min-height: 250px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Override html5-qrcode defaults for cleaner look */
  #reader__scan_region {
    background: transparent !important;
    border: none !important;
  }
  
  #reader__dashboard {
    display: none !important; /* Hide the default dashboard controls */
  }

  /* Message Box */
  #message {
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.3s, transform 0.3s;
    display: none;
  }

  #message.visible {
    opacity: 1;
    transform: translateY(0);
    display: block;
  }

  .success { 
    background-color: #e8f8f5; 
    color: var(--success-color); 
    border: 1px solid #d1f2eb; 
  }
  
  .error { 
    background-color: #fdecea; 
    color: var(--error-color); 
    border: 1px solid #fadbd8; 
  }

</style>
</head>

<body>

<div class="app-container">
  <div class="header">
    <h2>Scan Attendance</h2>
    <button id="logoutBtn" class="logout-btn">Logout</button>
  </div>

  <p class="instruction">Point camera at the School QR Code</p>

  <div id="reader"></div>
  
  <div id="message"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { 
  getFirestore,
  doc,
  setDoc,
  getDoc,
  updateDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCOzfdIXBeh6drFhml4pOFEvPG8xV_Wjzw",
  authDomain: "school-management-projec-9db7a.firebaseapp.com",
  projectId: "school-management-projec-9db7a",
  storageBucket: "school-management-projec-9db7a.firebasestorage.app",
  messagingSenderId: "975842483778",
  appId: "1:975842483778:web:d1708792ff56014f3317db"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ===== Load logged-in teacher ===== */
const loggedInTeacher = JSON.parse(localStorage.getItem("teacherLogin"));

if (!loggedInTeacher) {
  alert("Not logged in");
  window.location.href = "teacher-login.html";
}

const msg = document.getElementById("message");

// Helper to show messages
function showMessage(text, type) {
  msg.textContent = text;
  msg.className = type; // 'success' or 'error'
  msg.classList.add('visible');
}

/* ===== Helpers (Kept Original Logic) ===== */
function getToday() {
  return new Date().toISOString().split("T")[0];
}

function getCurrentTime() {
  const d = new Date();
  return d.toTimeString().slice(0, 5); // HH:MM
}

/* ===== Entry / Exit Logic (Kept Original Logic) ===== */
async function markAttendance() {
  const today = getToday();
  const nowTime = getCurrentTime();

  const attendanceRef = doc(
    db,
    "attendance",
    loggedInTeacher.schoolId,
    today,
    loggedInTeacher.teacherId
  );

  const snap = await getDoc(attendanceRef);

  // First scan = entry
  if (!snap.exists()) {
    await setDoc(attendanceRef, {
      teacherId: loggedInTeacher.teacherId,
      teacherName: loggedInTeacher.name,
      schoolId: loggedInTeacher.schoolId,
      date: today,
      entryTime: nowTime,
      status: "Present",
      createdAt: serverTimestamp()
    });

    showMessage("Entry time marked: " + nowTime, "success");
    return;
  }

  const data = snap.data();

  // Second scan = exit
  if (!data.exitTime) {
    await updateDoc(attendanceRef, {
      exitTime: nowTime,
      updatedAt: serverTimestamp()
    });

    showMessage("Exit time marked: " + nowTime, "success");
    return;
  }

  // Already done
  showMessage("Attendance already completed for today", "error");
}

/* ===== QR handler (Kept Original Logic) ===== */
async function onScanSuccess(decodedText) {
  try {
    const qrData = JSON.parse(decodedText);

    if (
      String(qrData.schoolId) === String(loggedInTeacher.schoolId) &&
      qrData.purpose === "teacher-attendance"
    ) {
      await markAttendance();
      // Stop scanning after success
      html5QrCode.stop();
    } else {
      showMessage("Invalid school QR code", "error");
    }

  } catch {
    showMessage("Invalid QR format", "error");
  }
}

/* ===== Start back camera ===== */
const html5QrCode = new Html5Qrcode("reader");

html5QrCode.start(
  { facingMode: "environment" },
  { fps: 10, qrbox: { width: 250, height: 250 } }, // Square box for scanning
  onScanSuccess
).catch(err => {
  showMessage("Camera access denied or not available", "error");
  console.error(err);
});

/* ===== Logout Logic ===== */
document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.removeItem("teacherLogin");
  // Stop camera if active
  if(html5QrCode && html5QrCode.isScanning) {
    html5QrCode.stop().then(() => {
       window.location.href = "teacher-login.html";
    }).catch(() => {
       window.location.href = "teacher-login.html";
    });
  } else {
    window.location.href = "teacher-login.html";
  }
});

</script>

</body>
</html>
