<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance Scan | Academic Portal</title>

    <!-- QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --primary-light: #818cf8;
            --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #6d28d9 100%);
            --sidebar-gradient: linear-gradient(180deg, #1e1b4b 0%, #312e81 40%, #4f46e5 100%);
            --bg: linear-gradient(135deg, #eef3fc 0%, #e6ecf7 30%, #f0f4fa 70%, #e8edf5 100%);
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-light: #94a3b8;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.06);
            --shadow-xl: 0 24px 60px rgba(0, 0, 0, 0.15), 0 8px 20px rgba(0, 0, 0, 0.08);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-full: 9999px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg);
            background-attachment: fixed;
            -webkit-background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            padding-left: 260px;
            transition: padding-left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ---------- SIDEBAR ---------- */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 260px;
            background: var(--sidebar-gradient);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 4px 0 30px rgba(30, 27, 75, 0.35);
            overflow-y: auto;
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }

        .sidebar-header {
            padding: 24px 20px 16px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 16px;
        }
        .sidebar-header .logo-icon {
            width: 56px;
            height: 56px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        .sidebar-header h3 {
            color: #fff;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 12px 14px;
            font-weight: 500;
            font-size: 14px;
            border-radius: var(--radius-md);
            transition: all var(--transition);
            margin-bottom: 4px;
        }
        .sidebar a .nav-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            background: rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }
        .sidebar a:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            transform: translateX(4px);
        }
        .sidebar a.active {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .sidebar a.active::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 20%;
            bottom: 20%;
            width: 4px;
            background: #fff;
            border-radius: 0 4px 4px 0;
        }

        /* ---------- SVG ICONS ---------- */
        .logo-icon svg,
        .nav-icon svg {
            display: block;
            flex-shrink: 0;
        }
        .sidebar-header .logo-icon {
            color: #fff;
        }
        .logo-icon svg {
            width: 28px;
            height: 28px;
        }
        .nav-icon svg {
            width: 18px;
            height: 18px;
        }

        /* Hamburger */
        .hamburger {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1100;
            background: var(--primary);
            color: #fff;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            cursor: pointer;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 5px;
            box-shadow: var(--shadow-lg);
            transition: all var(--transition);
        }
        .hamburger:hover { transform: scale(1.05); }
        .hamburger span {
            display: block;
            width: 22px;
            height: 2.5px;
            background: #fff;
            border-radius: 3px;
            transition: all var(--transition);
        }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 900;
            opacity: 0;
            transition: opacity 0.4s;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .overlay.show { opacity: 1; }

        /* ---------- MAIN CONTENT ---------- */
        .main-content {
            padding: 32px 36px;
            max-width: 800px;
            min-height: 100vh;
            margin: 0 auto;
        }

        .header {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 24px 28px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(99, 102, 241, 0.15);
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .card:hover {
            box-shadow: var(--shadow-md);
            border-color: rgba(79, 70, 229, 0.3);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--primary-gradient);
            opacity: 0;
            transition: opacity var(--transition);
        }

        .card:hover::before { opacity: 1; }

        .card h2 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 8px;
        }

        .card p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 16px;
        }

        #reader {
            width: 100%;
            max-width: 350px;
            margin: 20px auto;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 2px solid var(--border);
            background: #000;
        }

        #reader video {
            border-radius: var(--radius-sm);
            object-fit: cover;
        }

        .msg {
            margin-top: 15px;
            font-size: 16px;
            font-weight: 600;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            display: none;
        }

        .msg svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .msg.success {
            background: #ecfdf5;
            color: var(--success);
            border: 1px solid #a7f3d0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .msg.error {
            background: #fef2f2;
            color: var(--danger);
            border: 1px solid #fecaca;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .msg.info {
            background: #eff6ff;
            color: var(--primary);
            border: 1px solid #bfdbfe;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* ---------- MOBILE RESPONSIVE ---------- */
        @media (max-width: 768px) {
            body {
                padding-left: 0;
            }
            .sidebar {
                transform: translateX(-100%);
                width: 280px;
            }
            .sidebar.open {
                transform: translateX(0);
                box-shadow: 8px 0 40px rgba(0,0,0,0.3);
            }
            .hamburger { display: flex; }
            .overlay { display: block; pointer-events: none; }
            .overlay.show { pointer-events: auto; }

            .main-content {
                padding: 76px 16px 24px;
            }
            .header {
                font-size: 22px;
            }
            .card {
                padding: 18px 16px;
            }
            #reader {
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            .main-content { padding: 68px 10px 16px; }
            .header { font-size: 20px; }
            .card { padding: 16px 12px; }
        }
    </style>
</head>
<body>

                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">Scan Attendance QR</div>
        <p class="subtitle">Scan Teacher QR for entry/exit or Student QR for student entry</p>

        <div class="card">
            <h2>Attendance Scanner</h2>
            <p>Position the QR code within the scanner frame</p>

            <div id="reader"></div>
            <div id="message" class="msg"></div>
        </div>
    </div>

    <!-- Firebase SDKs -->
   <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";

    import {
        getFirestore,
        doc,
        setDoc,
        getDoc,
        updateDoc,
        collection,
        query,
        where,
        getDocs,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";


    // =========================
    // FIREBASE CONFIG
    // =========================

    const firebaseConfig = {
        apiKey: "AIzaSyCOzfdIXBeh6drFhml4pOFEvPG8xV_Wjzw",
        authDomain: "school-management-projec-9db7a.firebaseapp.com",
        projectId: "school-management-projec-9db7a",
        storageBucket: "school-management-projec-9db7a.firebasestorage.app",
        messagingSenderId: "975842483778",
        appId: "1:975842483778:web:d1708792ff56014f3317db",
        measurementId: "G-1X2Q7LE6G3"
    };


    // =========================
    // INITIALIZE FIREBASE
    // =========================

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);


    // =========================
    // GET LOGGED-IN TEACHER
    // =========================

    const teacherLoginData = localStorage.getItem("teacherLogin");

    if (!teacherLoginData) {
        alert("Please login first");
        window.location.href = "index.html";
        throw new Error("Teacher login not found");
    }


    const loggedInTeacher = JSON.parse(teacherLoginData);


    // =========================
    // IMPORTANT VALIDATION
    // =========================

    if (!loggedInTeacher.teacherId || !loggedInTeacher.schoolId || !loggedInTeacher.ownerId) {
        alert("Invalid teacher login data. Please login again.");
        localStorage.removeItem("teacherLogin");
        window.location.href = "index.html";
        throw new Error("Invalid teacher login data");
    }


    const msg = document.getElementById("message");


    // =========================
    // MESSAGE ICONS
    // =========================

    const msgIcons = {
        success: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>',
        error: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>',
        info: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>'
    };


    function showMessage(text, type) {
        msg.innerHTML = (msgIcons[type] || "") + text;
        msg.className = `msg ${type}`;
    }


    // =========================
    // LOCAL DATE
    // =========================

    function getLocalDate() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const day = String(now.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
    }


    // =========================
    // SCAN LOCK
    // =========================

    let scanLocked = false;


    // =========================
    // STOP CAMERA
    // =========================

    async function stopScanner() {
        try {
            await html5QrCode.stop();
        } catch (error) {
            console.log("Scanner already stopped");
        }
    }


    // =========================
    // TEACHER SAVE ENTRY / EXIT
    // =========================

    async function saveTeacherAttendance() {

        const today = getLocalDate();

        const attendanceRef = doc(db, "attendance", loggedInTeacher.schoolId, today, loggedInTeacher.teacherId);
        const attendanceSnapshot = await getDoc(attendanceRef);

        // FIRST SCAN = ENTRY
        if (!attendanceSnapshot.exists()) {
            await setDoc(attendanceRef, {
                teacherId: loggedInTeacher.teacherId,
                teacherName: loggedInTeacher.name || "",
                teacherClass: loggedInTeacher.teacherClass || "",
                schoolId: loggedInTeacher.schoolId,
                ownerId: loggedInTeacher.ownerId,
                date: today,
                status: "Present",
                method: "QR",
                entryTime: serverTimestamp(),
                exitTime: null,
                scanCount: 1,
                attendanceStatus: "ENTRY",
                createdAt: serverTimestamp(),
                updatedAt: serverTimestamp()
            });
            return { success: true, type: "ENTRY" };
        }

        const attendanceData = attendanceSnapshot.data();

        // SECOND SCAN = EXIT
        if (!attendanceData.exitTime) {
            await updateDoc(attendanceRef, {
                exitTime: serverTimestamp(),
                scanCount: 2,
                attendanceStatus: "COMPLETED",
                updatedAt: serverTimestamp()
            });
            return { success: true, type: "EXIT" };
        }

        // THIRD SCAN BLOCKED
        return { success: false, type: "LIMIT_REACHED" };
    }


    // =========================
    // QR SCAN SUCCESS (Main Logic)
    // =========================

    async function onScanSuccess(decodedText) {

        if (scanLocked) return;

        scanLocked = true;

        try {
            // কনসোল লগ করে দেখতে পারবেন QR-এ ঠিক কী লেখা আছে
            console.log("Scanned Text:", decodedText); 

            // ১. প্রথমে চেক করি ডেটাটি JSON কি না (টিচারের QR এর জন্য)
            let isTeacherQR = false;
            let qrData = null;

            try {
                qrData = JSON.parse(decodedText);
                if (qrData && qrData.purpose === "teacher-attendance") {
                    isTeacherQR = true;
                }
            } catch (e) {
                // JSON না হলে কিছু করব না, এটি স্টুডেন্টের QR হতে পারে
            }

            // ----------------------------------------
            // টিচারের অ্যাটেনডেন্স লজিক
            // ----------------------------------------
            if (isTeacherQR) {
                if (qrData.schoolId !== loggedInTeacher.schoolId) {
                    showMessage("This QR code belongs to another school", "error");
                    scanLocked = false;
                    return;
                }

                showMessage("Teacher QR verified. Processing...", "info");
                const result = await saveTeacherAttendance();

                if (result.success && (result.type === "ENTRY" || result.type === "EXIT")) {
                    showMessage(`${result.type === "ENTRY" ? "Entry" : "Exit"} marked successfully!`, "success");
                    await stopScanner();
                    setTimeout(() => { window.location.href = "student-list.html"; }, 1500);
                    return;
                }

                if (result.type === "LIMIT_REACHED") {
                    showMessage("Attendance already completed today. Only 2 scans are allowed.", "error");
                    scanLocked = false;
                    return;
                }
                return;
            }

            // ----------------------------------------
            // স্টুডেন্টের অ্যাটেনডেন্স লজিক (Plain Text QR)
            // ----------------------------------------
            let studentName = "", studentClass = "", studentRoll = "", studentId = "";

            // যদি QR কোডে JSON থাকে (ভবিষ্যতের জন্য)
            if (qrData) {
                studentName = qrData.name || qrData.studentName || "";
                studentClass = qrData.class || qrData.studentClass || "";
                studentRoll = qrData.roll || "";
                studentId = qrData.studentId || "";
            }

            // যদি JSON না থাকে, তবে লাইন ধরে ধরে টেক্সট পড়বে (Regex এর চেয়ে অনেক নিরাপদ)
            if (!studentId && !studentRoll) {
                const lines = decodedText.split('\n');
                for (let line of lines) {
                    const cleanLine = line.trim();
                    const lowerLine = cleanLine.toLowerCase();

                    if (lowerLine.startsWith("name:")) {
                        studentName = cleanLine.substring(5).trim();
                    } else if (lowerLine.startsWith("class:")) {
                        studentClass = cleanLine.substring(6).trim();
                    } else if (lowerLine.startsWith("roll:")) {
                        studentRoll = cleanLine.substring(5).trim();
                    }
                }
            }

            if (!studentName && !studentId) {
                showMessage("Invalid QR. Please scan a valid student ID card.", "error");
                scanLocked = false;
                return;
            }

            showMessage(`Searching student ${studentName || studentId}...`, "info");

            let targetDoc = null;
            let studentData = null;

            // ১. studentId দিয়ে খোঁজা (যদি থাকে)
            if (studentId) {
                const qId = query(collection(db, "students"), where("ownerId", "==", loggedInTeacher.ownerId), where("studentId", "==", studentId));
                const snapId = await getDocs(qId);
                if (!snapId.empty) {
                    targetDoc = snapId.docs[0];
                    studentData = targetDoc.data();
                }
            }

            // ২. ক্লাস এবং রোল/নাম দিয়ে খোঁজা (ফায়ারবেসের Number/String মিসম্যাচ এড়াতে)
            if (!targetDoc && studentClass) {
                const qClass = query(collection(db, "students"), where("ownerId", "==", loggedInTeacher.ownerId), where("studentClass", "==", studentClass));
                const snapClass = await getDocs(qClass);

                snapClass.forEach(doc => {
                    const data = doc.data();
                    const dbRoll = String(data.roll || "").trim().toLowerCase();
                    const dbName = String(data.name || "").trim().toLowerCase();
                    const qrRoll = String(studentRoll || "").trim().toLowerCase();
                    const qrName = String(studentName || "").trim().toLowerCase();

                    // রোল মিললে বা নাম মিললে সেটাকে সিলেক্ট করবে
                    if (qrRoll && dbRoll === qrRoll) {
                        targetDoc = doc;
                        studentData = data;
                    } else if (qrName && dbName === qrName) {
                        targetDoc = doc;
                        studentData = data;
                    }
                });
            }

            if (!targetDoc) {
                showMessage(`Student not found in database.`, "error");
                scanLocked = false;
                return;
            }

            const today = getLocalDate();
            const attendanceRef = doc(db, "attendance", loggedInTeacher.schoolId, today, "student_" + targetDoc.id);
            const attSnap = await getDoc(attendanceRef);

            if (attSnap.exists()) {
                showMessage(`Student ${studentData.name} is already marked Present today.`, "info");
                scanLocked = false;
                return;
            }

            // স্টুডেন্টের এন্ট্রি ফায়ারবেসে সেভ করা
            await setDoc(attendanceRef, {
                studentId: studentData.studentId || "",
                studentDocId: targetDoc.id,
                studentName: studentData.name || studentName,
                studentClass: studentData.studentClass || studentClass,
                roll: studentData.roll || studentRoll,
                schoolId: loggedInTeacher.schoolId,
                ownerId: loggedInTeacher.ownerId,
                date: today,
                status: "Present",
                entryTime: serverTimestamp(),
                markedBy: loggedInTeacher.name || loggedInTeacher.teacherId,
                markedByTeacherId: loggedInTeacher.teacherId,
                attendanceStatus: "STUDENT_ENTRY"
            });

            showMessage(`Student ${studentData.name} entry marked successfully by Teacher ${loggedInTeacher.name}!`, "success");

            await stopScanner();
            setTimeout(() => {
                window.location.href = "student-attendance-dashboard.html"; 
            }, 2000);

        } catch (error) {
            console.error("QR Scan Error:", error);
            showMessage("Error processing QR code. Check browser console.", "error");
            scanLocked = false;
        }
    }


    // =========================
    // START CAMERA
    // =========================

    const html5QrCode = new Html5Qrcode("reader");

    html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        onScanSuccess
    ).catch(err => {
        console.error("Camera Error:", err);
        showMessage("Camera access denied or camera could not be started", "error");
    });

</script>
<script type="module" src="back-button.js"></script>
<script type="module">
    import './admob.js';
</script>
